name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Syntax check
        run: |
          while IFS= read -r file; do bash -n "$file"; done < <(find bin lib tests -type f \( -name '*.sh' -o -path 'bin/varon' \))
      - name: ShellCheck
        run: shellcheck --external-sources bin/varon lib/*.sh tests/*.sh
      - name: Unit tests
        run: |
          for test_file in tests/test-*.sh; do
            bash "$test_file"
          done
