<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Infobot</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #edf4ff; background: radial-gradient(circle at 15% 0%, #1f4b7b 0, transparent 34rem), radial-gradient(circle at 100% 100%, #273055 0, transparent 30rem), #0b1220; }
    .page { width: min(1100px, calc(100% - 32px)); margin: auto; padding: 22px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 1.1rem; font-weight: 750; letter-spacing: .02em; }
    .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; background: #62d7f6; color: #07111e; font-weight: 900; }
    .status { border: 1px solid #31516d; border-radius: 999px; padding: 7px 11px; color: #b9d9eb; font-size: .82rem; }
    main { padding-top: clamp(64px, 14vh, 140px); }
    .eyebrow { color: #62d7f6; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 14px 0 18px; font-size: clamp(2.45rem, 7vw, 5.5rem); line-height: .98; letter-spacing: -.065em; }
    .lead { max-width: 610px; margin: 0; color: #b5c6d9; line-height: 1.65; font-size: 1.04rem; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 48px; }
    button { min-height: 132px; padding: 20px; border: 1px solid #2c4663; border-radius: 18px; color: inherit; background: rgba(16, 30, 48, .72); text-align: left; cursor: pointer; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
    button:hover, button:focus-visible { transform: translateY(-3px); border-color: #62d7f6; background: #162a43; outline: none; }
    button strong { display: block; margin-bottom: 8px; font-size: 1rem; }
    button span { color: #95abc2; font-size: .84rem; line-height: 1.35; }
    #notice { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 130px); width: min(420px, calc(100% - 32px)); padding: 14px 16px; border: 1px solid #31516d; border-radius: 14px; background: #14253a; box-shadow: 0 15px 50px #0008; transition: transform .2s ease; text-align: center; }
    #notice.visible { transform: translate(-50%, 0); }
    footer { margin-top: 52px; color: #7f96ad; font-size: .8rem; }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } button { min-height: 112px; } }
    @media (max-width: 390px) { .page { width: min(100% - 24px, 1100px); } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><span class="mark">i</span>Infobot</div>
      <div class="status">Сервис доступен</div>
    </header>
    <main>
      <div class="eyebrow">Платформа</div>
      <h1>Новое приложение уже на подходе.</h1>
      <p class="lead">Мы собираем удобное пространство для важных вещей. Основные разделы уже готовы в макетах и скоро появятся здесь.</p>
      <div class="grid" aria-label="Разделы приложения">
        <button type="button" data-section="Приложение"><strong>Приложение</strong><span>Единое пространство на каждый день</span></button>
        <button type="button" data-section="Новости"><strong>Новости</strong><span>Свежие обновления и события</span></button>
        <button type="button" data-section="Профиль"><strong>Профиль</strong><span>Настройки и персональные данные</span></button>
        <button type="button" data-section="Поддержка"><strong>Поддержка</strong><span>Ответы на частые вопросы</span></button>
      </div>
    </main>
    <footer>© 2026 Infobot</footer>
  </div>
  <div id="notice" role="status" aria-live="polite">Раздел в разработке</div>
  <script>
    const notice = document.querySelector('#notice');
    let timer;
    document.querySelectorAll('[data-section]').forEach((button) => {
      button.addEventListener('click', () => {
        notice.textContent = button.dataset.section + ': раздел в разработке';
        notice.classList.add('visible');
        clearTimeout(timer);
        timer = setTimeout(() => notice.classList.remove('visible'), 2600);
      });
    });
  </script>
</body>
</html>
